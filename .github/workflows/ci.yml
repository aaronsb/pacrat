name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      # After `test`, deliberately: `cargo test` has built the debug binary
      # by then, so the harness finds it and its last stage drives a real
      # `pacrat grade` through the adapter. Run before it, that stage would
      # silently skip. jq and python3 are both on ubuntu-latest; yay-friend
      # is not, and is not needed — the harness fakes it.
      - name: contrib graders
        run: ./contrib/graders/test-yay-friend-grade.sh
      # The scenario rig (ADR-005) writes an asciinema cast per run. On a
      # green run they are noise; on a red one they are the replayable
      # record of what the failing terminal actually showed, so they are
      # kept exactly then.
      - name: keep the rig's casts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rig-casts-check
          path: target/rig-casts/
          if-no-files-found: ignore

  # The publish path needs makepkg, which is Arch's, so on ubuntu-latest the
  # `pacrat push` tests skip themselves and the job above goes green having
  # never exercised the one verb that writes to somebody else's repository.
  # This job is where they actually run. `PACRAT_REQUIRE_MAKEPKG=1` makes a
  # skip here a failure — the whole point of the job is that these run, so
  # "skipped" is a broken container, not a pass.
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # base-devel carries makepkg; jq and python are the contrib harness's.
      # Rust comes from pacman rather than rustup: the container is already a
      # rolling release, and one package manager is enough.
      - name: dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust jq python
      - uses: actions/checkout@v4
      # makepkg refuses to run as root, and a container is root by default.
      # A plain user with a writable checkout is the smallest fix; `nobody`
      # would need a home directory for git's config.
      - name: unprivileged user
        run: |
          useradd -m builder
          chown -R builder:builder .
      - name: test
        run: |
          su builder -c 'PACRAT_REQUIRE_MAKEPKG=1 cargo test --workspace'
        env:
          CARGO_TERM_COLOR: always
      # Same rule as the check job: the rig's casts are evidence, kept only
      # when there is a failure to explain.
      - name: keep the rig's casts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rig-casts-arch
          path: target/rig-casts/
          if-no-files-found: ignore
